            <a href="#" class="link-item">

                </div>

                </div>  
            </a> 
            
            
         
            <a href="#"> <img src="img/sales.png" alt="sales">    </a>

<section id="heroSection">

</section>

</section>

 <div style="display: flex; gap: 15px;">

 </div>
